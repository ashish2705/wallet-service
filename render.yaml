services:
  - type: web
    name: wallet-service
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    buildFilter:
      ignoredPaths:
        - "**/*.md"
        - "docs/**"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wallet-service-postgres
          property: connectionString
      - key: LOG_LEVEL
        value: info
      - key: ADMIN_TOKEN
        generateValue: true

databases:
  - name: wallet-service-postgres
    plan: free
    databaseName: wallet
    user: wallet
